# Bigface — https://github.com/gjuoun/bigface-theme
# Add to ~/.tmux.conf:  source-file ~/.config/tmux/bigface.conf
set -g status-style "bg=#333333,fg=#75715e"
set -g status-left-style "bg=#00b0ff,fg=#252925,bold"
set -g status-right-style "bg=#333333,fg=#75715e"
set -g window-status-style "bg=#333333,fg=#6e6b68"
set -g window-status-current-style "bg=#3b3c32,fg=#c6ff00,bold"
set -g window-status-activity-style "bg=#333333,fg=#fc5d23"
set -g window-status-bell-style "bg=#f52670,fg=#252925"
set -g pane-border-style "fg=#494848"
set -g pane-active-border-style "fg=#00b0ff"
set -g message-style "bg=#3b3c32,fg=#d9d9d4"
set -g message-command-style "bg=#3b3c32,fg=#e5e500"
set -g mode-style "bg=#646464,fg=#d9d9d4"
set -g clock-mode-colour "#00b0ff"
set -g display-panes-colour "#6e6b68"
set -g display-panes-active-colour "#fc5d23"
set -g copy-mode-match-style "bg=#ffe792,fg=#252621"
set -g copy-mode-current-match-style "bg=#fc5d23,fg=#252925"
