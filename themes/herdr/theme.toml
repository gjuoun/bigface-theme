# Bigface for herdr — https://github.com/gjuoun/bigface-theme
# Paste into ~/.config/herdr/config.toml next to your [theme] table (keep `name`; this layers on top).
[theme.custom]
accent        = "#00b0ff" # links, focus rings
text          = "#d9d9d4" # primary foreground
subtext0      = "#9c9a8f" # secondary foreground
overlay1      = "#75715e" # dimmer tier
overlay0      = "#6e6b68" # muted tokens, separators
panel_bg      = "#252925" # main pane background
sidebar_bg    = "#1f231f" # sidebar, darker than panel
active_row_bg = "#3b3c32" # focused / hovered sidebar row
selection_bg  = "#646464" # text selection
surface0      = "#2e332e" # raised surface
surface1      = "#3b3c32" # overlay surface
surface_dim   = "#1f231f" # inset surface
green         = "#00c853" # success
yellow        = "#e5e500" # attention
red           = "#f52670" # danger
blue          = "#00b0ff" # accent blue
teal          = "#66d9ef" # info
peach         = "#ff9800" # warning / severe
mauve         = "#ae81ff" # merged / done
