name: Deploy to Cloudflare Pages

# The only deployment: build the site and push it to the bigface-theme Pages project behind
# https://bigface.qqntt.com/ (root base). Runs on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run site:build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 20045ddbb9002faab76593c79956a347
          command: pages deploy site/dist --project-name bigface-theme --branch main
