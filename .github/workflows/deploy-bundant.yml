name: Deploy bundant site

# STOPGAP — delete this file once gjuoun/bundant carries its own
# CLOUDFLARE_API_TOKEN secret (Settings → Secrets → Actions). The Cloudflare
# account token for this account lives in THIS repo's secrets, and GitHub never
# exposes a secret's value, so a cross-repo deploy is the only way to ship the
# bundant site without a new credential. Manual dispatch only: nothing here runs
# on push.
#
# Deploys gjuoun/bundant's Astro site to the Cloudflare Pages project `bundant`
# at the ROOT base (SITE_BASE=/), then attaches bundant.qqntt.com.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-bundant
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: gjuoun/bundant
          ref: main
          path: bundant

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build (root base)
        working-directory: bundant/site
        env:
          SITE_BASE: /
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 20045ddbb9002faab76593c79956a347
        run: |
          npx --yes wrangler@4 pages project create bundant --production-branch main || true

      # Plain `npx wrangler` on purpose: wrangler-action wants a wrangler already
      # installed in the workspace, which this cross-repo job does not have.
      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 20045ddbb9002faab76593c79956a347
        run: npx --yes wrangler@4 pages deploy bundant/site/dist --project-name bundant --branch main

      # The zone carries a wildcard (*.qqntt.com) that parks unknown names on a
      # link-in-bio page, so the custom domain only works once an EXPLICIT
      # record for this host exists. Upsert a proxied CNAME to the Pages host.
      - name: Point DNS at the Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: b7b840b1e83ad28dd2ead13687eeadf8
        run: |
          set -euo pipefail
          NAME="bundant.qqntt.com"
          EXISTING=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$NAME&per_page=50")
          IDS=$(echo "$EXISTING" | jq -r '.result[]? | select(.type=="CNAME" or .type=="A" or .type=="AAAA") | .id' | head -5)
          if [ -n "$IDS" ]; then
            for id in $IDS; do
              echo "deleting stale record $id"
              curl -sS -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$id" >/dev/null
            done
          fi
          curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"type":"CNAME","name":"bundant","content":"bundant.pages.dev","proxied":true,"ttl":1}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" | head -c 400
          echo

      - name: Attach custom domain bundant.qqntt.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: 20045ddbb9002faab76593c79956a347
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"bundant.qqntt.com"}' \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/bundant/domains" \
            | head -c 600
          echo
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/bundant/domains" \
            | head -c 600
