name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # typecheck + biome + every generator test + the site build test.
      # Tests that need a tool (ghostty, herdr, zellij, …) skip themselves when it is not installed.
      - run: bun run check
      # A palette edit must come with regenerated themes/ and the package's default tokens.
      - name: themes/, tokens.css and the light palette are up to date
        run: |
          bun run themes
          bun run theme:sync
          bun run light
          git diff --exit-code themes packages/ui/src/styles/tokens.css palette/bigface-light.json
